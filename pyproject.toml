[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-ota"
version = "0.2.0"
description = "Multi-Agent Reinforcement Learning for Coordinated Automotive OTA Updates"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Saadman Sakib", email = "saadmansakib@iut-dhaka.edu" },
    { name = "Mohtasim Dipto" },
    { name = "Mahin Islam" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marl_ota*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
